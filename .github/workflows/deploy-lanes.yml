name: Deploy lanes
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-lane-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  deploy:
    name: deploy lane
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'production' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Reset and deploy selected environment
        run: npm run deploy:lane -- "$GITHUB_REF_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          CLOUDFLARE_ACCESS_ALLOWED_EMAIL: ${{ vars.CLOUDFLARE_ACCESS_ALLOWED_EMAIL }}
          LANE_RESET_APPROVED: ${{ vars.LANE_RESET_APPROVED }}
